---
# Decrypt one sops file to its target path (sops-nix secret). Expects `sops_secret`.
- name: "Check decryption prerequisites for {{ sops_secret.name }}"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: ["{{ sops_age_keyfile }}", "{{ sops_binary }}", "{{ sops_secret.sops_file }}"]
  register: sops_secret_prereqs

- name: "Skip {{ sops_secret.name }}"
  ansible.builtin.debug:
    msg: "Skipping secret {{ sops_secret.name }}: missing {{ sops_secret_prereqs.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}"
  when: sops_secret_prereqs.results | rejectattr('stat.exists') | list | length > 0

- name: "Deploy {{ sops_secret.name }}"
  when: sops_secret_prereqs.results | rejectattr('stat.exists') | list | length == 0
  block:
    - name: "Create parent directory for {{ sops_secret.name }}"
      ansible.builtin.file:
        path: "{{ sops_secret.path | dirname }}"
        state: directory
        mode: "0755"

    - name: "Decrypt {{ sops_secret.name }}"
      ansible.builtin.copy:
        content: >-
          {{ lookup('community.sops.sops', sops_secret.sops_file,
                    input_type=sops_secret.format | default('binary'),
                    output_type=sops_secret.format | default('binary'),
                    rstrip=false) }}
        dest: "{{ sops_secret.path }}"
        mode: "{{ sops_secret.mode | default(sops_secret_default_mode | default('0400')) }}"
      no_log: true
