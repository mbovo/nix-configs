---
sops_packages: [sops, age]
# sops-nix `sops.secrets` equivalent; each item: {name, sops_file, path, format (binary|yaml|json|dotenv|ini), mode}.
sops_secrets: []
sops_secret_default_mode: "0400"

# Paths this role writes (backed up before the first write, restored on uninstall). The age key is never touched.
sops_managed_files: "{{ sops_secrets | map(attribute='path') | list }}"
