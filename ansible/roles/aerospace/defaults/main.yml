---
aerospace_enable: false
# Only published in the author's tap, not in homebrew/cask.
aerospace_cask: nikitabobko/tap/aerospace
aerospace_config_file: ""
aerospace_scratchpad_file: ""

# Paths this role writes (backed up before the first write, restored on uninstall).
aerospace_managed_files: >-
  {{ [home_directory ~ '/.config/aerospace/aerospace.toml', home_directory ~ '/bin/scratchpad.sh']
     if aerospace_enable | bool else [] }}
