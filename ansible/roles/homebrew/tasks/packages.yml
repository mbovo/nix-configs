---
# Install formulae/casks and record the ones this run added. Expects homebrew_formulae and/or homebrew_casks.
- name: Check for brew
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/bin/brew"
  register: homebrew_packages_brew

- name: Report packages a real run would install
  ansible.builtin.debug:
    msg: "Homebrew not installed yet; would install {{ homebrew_formulae | default([]) + homebrew_casks | default([]) }}"
  when:
    - not homebrew_packages_brew.stat.exists
    - ansible_check_mode

- name: Require brew outside dry runs
  ansible.builtin.assert:
    that: homebrew_packages_brew.stat.exists or ansible_check_mode
    fail_msg: "Homebrew not found in {{ homebrew_prefix }}: run playbooks/bootstrap.yml -K first."
    quiet: true

- name: Install and record packages
  when: homebrew_packages_brew.stat.exists
  block:
    - name: Select third-party taps needed by the packages
      ansible.builtin.set_fact:
        homebrew_needed_taps: >-
          {{ (homebrew_formulae | default([]) + homebrew_casks | default([]))
             | select('search', '^[^/]+/[^/]+/[^/]+$')
             | map('regex_replace', '/[^/]+$', '') | unique | list }}

    - name: List current taps
      ansible.builtin.command:
        argv: ["{{ homebrew_prefix }}/bin/brew", tap]
      register: homebrew_current_taps
      changed_when: false
      check_mode: false
      when: homebrew_needed_taps | length > 0

    # Homebrew no longer taps implicitly on `brew install user/tap/formula`.
    - name: Add third-party taps
      community.general.homebrew_tap:
        name: "{{ item }}"
        state: present
      loop: "{{ homebrew_needed_taps | reject('in', homebrew_current_taps.stdout_lines | default([])) | list }}"
      register: homebrew_tap_result

    - name: Record added taps
      ansible.builtin.include_role:
        name: manifest
        tasks_from: record.yml
      vars:
        manifest_kind: taps
        manifest_items: "{{ homebrew_tap_result.results | default([]) | selectattr('changed') | map(attribute='item') | list }}"

    - name: Start from all requested formulae
      ansible.builtin.set_fact:
        homebrew_formulae_ready: "{{ homebrew_formulae | default([]) }}"
        homebrew_new_taps: "{{ homebrew_tap_result.results | default([]) | selectattr('changed') | map(attribute='item') | list }}"

    # A dry run cannot query packages from taps it has not really added.
    - name: Leave out formulae from taps a real run would add
      ansible.builtin.set_fact:
        homebrew_formulae_ready: "{{ homebrew_formulae_ready | reject('match', (item ~ '/') | regex_escape) | list }}"
      loop: "{{ homebrew_new_taps }}"
      when: ansible_check_mode

    - name: Report packages from taps a real run would add
      ansible.builtin.debug:
        msg: >-
          Would install from new taps:
          {{ homebrew_formulae | default([]) | difference(homebrew_formulae_ready)
             + homebrew_casks | default([]) | select('match', '^(' ~ (homebrew_new_taps | map('regex_escape') | join('|')) ~ ')/') | list }}
      when:
        - ansible_check_mode
        - homebrew_new_taps | length > 0

    - name: "Install formulae {{ homebrew_formulae_ready | join(', ') }}"
      community.general.homebrew:
        name: "{{ homebrew_formulae_ready }}"
        state: present
      register: homebrew_formulae_result
      when: homebrew_formulae_ready | length > 0

    - name: Record installed formulae
      ansible.builtin.include_role:
        name: manifest
        tasks_from: record.yml
      vars:
        manifest_kind: formulae
        manifest_items: "{{ homebrew_formulae_result.changed_pkgs | default([]) }}"

    # One at a time: homebrew_cask does not report which casks it installed.
    - name: Install casks
      community.general.homebrew_cask:
        name: "{{ item }}"
        state: present
      loop: "{{ homebrew_casks | default([]) }}"
      register: homebrew_casks_result
      when: not ansible_check_mode or (item | regex_replace('/[^/]+$', '')) not in homebrew_new_taps

    - name: Record installed casks
      ansible.builtin.include_role:
        name: manifest
        tasks_from: record.yml
      vars:
        manifest_kind: casks
        manifest_items: "{{ homebrew_casks_result.results | default([]) | selectattr('changed') | map(attribute='item') | list }}"
