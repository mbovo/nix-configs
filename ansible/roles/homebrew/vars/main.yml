---
# Same layout the official install.sh creates when the repository is not the prefix root (Intel macOS, Linux).
homebrew_prefix_subdirs:
  - bin
  - etc
  - etc/bash_completion.d
  - include
  - lib
  - lib/pkgconfig
  - sbin
  - share
  - share/aclocal
  - share/doc
  - share/info
  - share/locale
  - share/man
  - share/man/man1
  - share/man/man2
  - share/man/man3
  - share/man/man4
  - share/man/man5
  - share/man/man6
  - share/man/man7
  - share/man/man8
  - share/zsh
  - share/zsh/site-functions
  - opt
  - var
  - var/homebrew
  - var/homebrew/linked
  - var/log
  - Cellar
  - Caskroom
  - Frameworks
  - Homebrew

homebrew_directories: >-
  {{ [homebrew_prefix] if homebrew_repository == homebrew_prefix
     else homebrew_prefix_subdirs | map('regex_replace', '^', homebrew_prefix ~ '/') | list }}

# What the official uninstall.sh deletes; with a separate repository, shared prefix dirs are kept.
homebrew_owned_paths: >-
  {{ [homebrew_prefix] if homebrew_repository == homebrew_prefix
     else [homebrew_repository, homebrew_prefix ~ '/Cellar', homebrew_prefix ~ '/Caskroom',
           homebrew_prefix ~ '/var/homebrew', homebrew_prefix ~ '/bin/brew',
           homebrew_prefix ~ '/etc/bash_completion.d/brew', homebrew_prefix ~ '/share/zsh/site-functions/_brew',
           homebrew_prefix ~ '/share/doc/homebrew', homebrew_prefix ~ '/share/man/man1/brew.1'] }}
homebrew_user_paths:
  - "{{ home_directory }}/Library/Caches/Homebrew"
  - "{{ home_directory }}/Library/Logs/Homebrew"
