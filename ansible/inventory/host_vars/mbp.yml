---
# hosts/2-host-mbp.nix (x86_64-darwin, personal laptop)
home_username: manuel

# modern.extra.packages = default_packages with devbox from unstable.
cli_tools_modern_extra_packages: "{{ cli_tools_modern_extra_default_packages }}"
cli_tools_modern_extra_nix_packages: "{{ cli_tools_modern_extra_default_nix_packages }}"

# pulumi-bin pinned nixpkgs rev -> upstream binary tap (homebrew/core has no Intel bottle).
dev_tools_pulumi_enable: true
dev_tools_pulumi_package: pulumi/tap/pulumi
dev_tools_pulumi_extra_packages: []

# pkgs-unstable.python3 -> Homebrew's default python3.
dev_tools_python_package: python@3.14
dev_tools_python_extra_packages: [pipenv, poetry]
dev_tools_go_enable: true

docker_enable: true
docker_darwin_packages: [qemu, lima, colima]

k8s_enable: true
k8s_extra_enable: true
k8s_extra_clusterctl_enable: true
k8s_extra_kyverno_enable: true
k8s_extra_fluxcd_enable: true

nixify_enable: true
nixify_binary_file: "{{ config_dir }}/flakes/nixify"
nixify_config_files:
  bin/flake_venv/flake.nix: "{{ config_dir }}/flakes/venv.nix"
  bin/flake_helm/flake.nix: "{{ config_dir }}/flakes/helm.nix"
